function tag(k){return k==="hire"?'<span class="badge hire">招聘/公示</span>':'<span class="badge info">馆务公告</span>';}
function card(it){
  return '<a class="card '+(it.k==="hire"?"hire":"")+'" href="'+it.u+'" target="_blank" rel="noopener">'+
   '<div class="row"><div class="tt">'+it.t+'</div>'+(it.k?tag(it.k):'')+'</div>'+
   '<div class="meta"><span>'+(it.d||"")+'</span>'+(it.s?'<span>· '+it.s+'</span>':'')+'</div></a>';
}

}
function block(name, items, extra){
  var h='<div class="sec-title"><span class="bar"></span>'+name+(extra||'')+'</div>';
  if(items && items.length) items.forEach(function(x){h+=card(x);});
  else h+=emptyMuseum(name);
  return h;
}
function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(function(x){return '<div class="tab '+(cur===x.id?"active":"")+'" onclick="setTab(\''+x.id+'\')">'+x.n+'</div>';}).join("");
}

function filterQ(a){var q=(document.getElementById("q").value||"").trim();if(!q)return a;return a.filter(function(x){return (x.t+' '+(x.d||'')).indexOf(q)>=0;});}

function render(){
  var h='<div class="section">';
  var q=(document.getElementById("q").value||"").trim();
  if(cur==="all"||cur==="hb"){
    h+=block("河北博物院 · 最新公告", filterQ(NEWS), '<a href="https://www.hebeimuseum.org.cn/list-79-1.html" target="_blank" rel="noopener" style="font-size:11px;color:#a8875a;text-decoration:none;font-weight:600">官网最新公告 →</a>');
  }
  if(cur==="all"||cur==="others"){
    var others=Object.keys(MGUIDE).filter(function(n){return n!=="河北博物院";});
    others.forEach(function(name){
      var items=null;
      if(MUSEUMS && MUSEUMS[name] && MUSEUMS[name].length){
        items=MUSEUMS[name].map(function(x){return {t:x.title,d:x.date||"",u:x.url,s:name};});
        if(q) items=filterQ(items);
      }
      h+=block(name, items);
    });
    if(cur==="all"||cur==="others"){
      h+='<div class="sec-title"><span class="bar"></span>官方信息源 · 实时公告</div>';

        var items=null;
        if(OFFICAL_DATA && OFFICAL_DATA[name] && OFFICAL_DATA[name].length){
          items=OFFICAL_DATA[name].map(function(x){return {t:x.title,d:x.date||"",u:x.url,s:name};});
          if(q) items=filterQ(items);
        }
        h+=block(name, items);
      });

function loadLive(){
  if(window.location.protocol==="file:")return;

    var x=new XMLHttpRequest(); x.open("GET","./data.json?t="+Date.now(),true); x.timeout=6000;
    x.onreadystatechange=function(){ if(x.readyState===4&&x.status===200){ try{apply(JSON.parse(x.responseText));}catch(e){} } };
    x.onerror=function(){}; x.send();
  }
  function tryApi(){
    var x=new XMLHttpRequest(); x.open("GET","/api/news?scope=all",true); x.timeout=6000;
    x.onreadystatechange=function(){ if(x.readyState===4&&x.status===200){ try{apply(JSON.parse(x.responseText));}catch(e){} } else if(x.readyState===4){ tryJson(); } };
    x.onerror=tryJson; x.send();
  }
  tryApi();
}
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("./sw.js");}catch(e){}}
renderTabs();render();loadLive();
